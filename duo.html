<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duo Test</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      body { display: flex; }
      iframe { flex: 1; height: 100%; border: 0; border-right: 2px solid #333; }
    </style>
  </head>
  <body>
    <!-- Dev-only: host and guest side by side, both on the emulated headset, auto-connected. -->
    <iframe id="host" title="Host"></iframe>
    <iframe id="guest" title="Guest"></iframe>
    <script>
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
      const base = './?emu&voice=0&auto&vr&loop';
      document.getElementById('host').src = `${base}&host&code=${code}`;
      setTimeout(() => { document.getElementById('guest').src = `${base}&room=${code}`; }, 3000);
    </script>
  </body>
</html>
